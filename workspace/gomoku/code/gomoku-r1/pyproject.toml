[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gomoku"
version = "0.4.0"
description = "Linux terminal Gomoku (human vs AI) with configurable rules, AI difficulty, and Renju forbidden-move support."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gomoku project" }]
keywords = ["gomoku", "renju", "terminal", "tui", "ai", "alpha-beta"]
classifiers = [
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pexpect>=4.8",
]

[project.scripts]
gomoku = "gomoku.main:main"

[project.urls]
Homepage = "https://github.com/chenyuxiangg/zteam"

[tool.setuptools]
packages = ["gomoku"]
include-package-data = true

[tool.setuptools.package-data]
gomoku = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
