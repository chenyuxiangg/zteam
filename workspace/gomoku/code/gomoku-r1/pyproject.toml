[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gomoku"
version = "0.1.0"
description = "Terminal Gomoku (五子棋) human-vs-AI game, configurable board/difficulty/forbidden rules."
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
gomoku = "gomoku.main:main"

[tool.setuptools]
packages = ["gomoku"]

[tool.setuptools.package-data]
gomoku = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
